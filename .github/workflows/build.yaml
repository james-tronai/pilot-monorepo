# Builds the three images on every PR and on main. Tags: <sha> (what the preview
# ApplicationSet deploys, head_sha) and pr-<n> / main for humans.
name: build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-orders, api-chat, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          ref="${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          platforms: linux/amd64
          push: true
          build-args: GIT_SHA=${{ steps.meta.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ steps.meta.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
