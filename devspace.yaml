# DevSpace: one full environment per developer in namespace dev-<you>, same Helm chart as
# preview. Dev mode swaps each container for a stock python/node image, syncs the source
# in and runs the hot-reloading dev server, so no image build is needed. startContainer: true
# holds the container until the initial sync is done (the command needs the sources).
#   devspace use namespace dev-james --create
#   devspace dev          # then open http://localhost:5173
#   devspace purge
version: v2beta1
name: pilot-monorepo

vars:
  DEV_ID:
    source: env
    default: james
  # Preview variant B (k3s-infra docs/preview-devspace-design.md §4): the in-cluster Job runs
  #   RELEASE=prb-<n> PR=<n> SHA=<head sha> devspace run-pipeline preview -n preview
  # and tears down with the same vars + `devspace purge`.
  RELEASE:
    source: env
    default: pilot
  PR:
    source: env
    default: "0"
  SHA:
    source: env
    default: main

pipelines:
  dev:
    run: |-
      create_deployments --all
      start_dev --all
  deploy:
    run: |-
      create_deployments --all
  preview:
    run: |-
      # --set here edits the DEPLOYMENT config, so chart values live under helm.values.
      create_deployments pilot \
        --set helm.values.image.tag=${SHA} \
        --set helm.values.host=prb-${PR}.preview.zenbyte.biz \
        --set helm.values.mongo.db=prb_${PR} \
        --set "helm.values.redis.prefix=prb${PR}:" \
        --set helm.values.ingress.forwardAuthMiddleware=preview-sso-auth

deployments:
  pilot:
    helm:
      releaseName: ${RELEASE}
      chart:
        path: ./deploy/chart
      values:
        mongo:
          db: dev_${DEV_ID}
        redis:
          prefix: "dev${DEV_ID}:"
        nodeSelector:
          homelab/role: agents

dev:
  api-orders:
    imageSelector: ghcr.io/james-tronai/pilot-monorepo/api-orders
    devImage: python:3.12-slim
    workingDir: /app
    sync:
      - path: ./apps/api-orders:/app
        excludePaths: [.venv, __pycache__]
        startContainer: true
    command: ["sh", "-c"]
    args: ["pip install -q uv && uv pip install --system -q . && exec uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"]
    ports:
      - port: "8001:8000"
  api-chat:
    imageSelector: ghcr.io/james-tronai/pilot-monorepo/api-chat
    devImage: python:3.12-slim
    workingDir: /app
    sync:
      - path: ./apps/api-chat:/app
        excludePaths: [.venv, __pycache__]
        startContainer: true
    command: ["sh", "-c"]
    args: ["pip install -q uv && uv pip install --system -q . && exec uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"]
    ports:
      - port: "8002:8000"
  web:
    imageSelector: ghcr.io/james-tronai/pilot-monorepo/web
    devImage: node:22-alpine
    workingDir: /app
    sync:
      - path: ./apps/web:/app
        excludePaths: [node_modules, dist]
        startContainer: true
    env:
      - name: API_ORDERS_URL
        value: http://pilot-api-orders:8000
      - name: API_CHAT_URL
        value: http://pilot-api-chat:8000
    command: ["sh", "-c"]
    args: ["npm ci --silent && exec npm run dev"]
    ports:
      - port: "5173:5173"
